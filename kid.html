<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Clubhouse</title>
  <meta name="theme-color" content="#0a0b0d">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clubhouse">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/clubhouse.css">
</head>
<body>

  <section id="k-msg" class="screen" hidden>
    <div class="panel center">
      <span class="js-mark"></span>
      <h1 id="k-msg-title">The Clubhouse</h1>
      <p class="tagline">Earn Your Wins</p>
      <p class="sub" id="k-msg-body"></p>
    </div>
  </section>

  <main id="k-app" hidden>
    <div class="wrap">
      <header class="topbar">
        <div class="brand"><span class="js-mark"></span>
          <div><div class="brand-name">The Clubhouse</div><div class="brand-tag">Earn Your Wins</div></div></div>
        <div class="top-actions" id="k-top"></div>
      </header>

      <!-- CLUBHOUSE -->
      <section data-tab="clubhouse">
        <div class="club has-q">
          <div class="a-card" id="k-card"></div>
          <div class="a-xp" id="k-xp"></div>
          <section class="a-q onair-card" id="k-q" aria-label="Postgame Interview" hidden>
            <div id="k-q-head"></div>
            <div id="k-j"></div>
          </section>
          <div class="a-bar panel" id="k-bar"></div>
          <div class="a-dugout" id="k-dugout"></div>
          <div class="a-tabs" id="k-tabs"></div>
        </div>
      </section>

      <!-- LINEUP -->
      <section data-tab="lineup" hidden>
        <h1 class="page-title">Daily Lineup</h1>
        <div class="page-sub" id="k-date"></div>
        <div class="panel" id="k-summary" style="margin-bottom:14px"></div>
        <div id="k-groups"></div>
        <div id="k-lineup-pg" style="margin-top:14px"></div>
      </section>

      <!-- PRIZE LOCKER -->
      <section data-tab="locker" hidden>
        <h1 class="page-title">Prize Locker</h1>
        <div class="page-sub">Unlock gear and prizes with XP</div>
        <div style="margin-bottom:14px"><span class="bal-chip">Balance <b id="k-bal">0</b> XP</span></div>
        <div id="k-ondeck" style="margin-bottom:14px"></div>
        <div class="locker" id="k-locker"></div>
      </section>

      <!-- STATS -->
      <section data-tab="stats" hidden>
        <h1 class="page-title">Stats</h1>
        <div class="page-sub">Season to date</div>
        <div class="bento">
          <div class="wide" id="k-box"></div>
          <div id="k-season"></div>
          <div>
            <div class="sec" style="margin-top:0"><h2>Road to the Hall</h2></div>
            <div id="k-ladder"></div>
          </div>
          <div class="wide">
            <div class="sec" style="margin-top:4px"><h2>Trophy Case</h2></div>
            <div id="k-trophies"></div>
          </div>
          <div class="wide">
            <div class="sec" style="margin-top:4px"><h2>Game Log</h2><span class="sub">Last 2 weeks</span></div>
            <div class="panel" id="k-log"></div>
          </div>
        </div>
      </section>
    </div>

    <nav class="nav" aria-label="Main">
      <div class="in">
        <button data-go="clubhouse" class="on" id="nav-clubhouse"></button>
        <button data-go="lineup" id="nav-lineup"></button>
        <button data-go="locker" id="nav-locker"></button>
        <button data-go="stats" id="nav-stats"></button>
      </div>
    </nav>
  </main>

  <script src="vendor/supabase-2.117.3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/kid.js"></script>
</body>
</html>

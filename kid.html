<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Clubhouse</title>
  <meta name="theme-color" content="#0a0b0d">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clubhouse">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/clubhouse.css">
</head>
<body>

  <section id="k-msg" class="screen" hidden>
    <div class="panel center">
      <span class="js-mark"></span>
      <h1 id="k-msg-title">The Clubhouse</h1>
      <p class="tagline">Earn Your Wins</p>
      <p class="sub" id="k-msg-body"></p>
    </div>
  </section>

  <main id="k-app" hidden>
    <div class="wrap">
      <header class="topbar">
        <button type="button" class="brand" data-go="clubhouse" aria-label="The Clubhouse: go to the home screen"><span class="js-mark"></span>
          <span><span class="brand-name">The Clubhouse</span><span class="brand-tag">Earn Your Wins</span></span></button>
      </header>

      <!-- TODAY: his two daily steps, then prizes -->
      <section data-tab="clubhouse">
        <div id="k-hero"></div>
        <div class="steps-head"><h2>Today</h2><span id="k-steps-count"></span></div>
        <div id="k-step-rate"></div>
        <section class="onair-card step-q" id="k-q" aria-label="Step 2: answer today's question" hidden>
          <div id="k-q-head"></div>
          <div id="k-j"></div>
        </section>
        <div class="sec"><h2>Prizes</h2><button class="link" data-go="locker">See all</button></div>
        <div id="k-prize-next"></div>
      </section>

      <!-- RATE MYSELF -->
      <section data-tab="lineup" hidden>
        <h1 class="page-title">Rate Myself</h1>
        <div class="page-sub" id="k-date"></div>
        <div class="panel" id="k-summary" style="margin-bottom:14px"></div>
        <div id="k-groups"></div>
      </section>

      <!-- PRIZES -->
      <section data-tab="locker" hidden>
        <h1 class="page-title">Prizes</h1>
        <div class="page-sub">What your XP can unlock</div>
        <div style="margin-bottom:14px"><span class="bal-chip">You have <b id="k-bal">0</b> XP</span></div>
        <div id="k-ondeck" style="margin-bottom:14px"></div>
        <div class="locker" id="k-locker"></div>
      </section>
    </div>

    <nav class="nav" aria-label="Main">
      <div class="in three">
        <button data-go="clubhouse" class="on" id="nav-clubhouse"></button>
        <button data-go="lineup" id="nav-lineup"></button>
        <button data-go="locker" id="nav-locker"></button>
      </div>
    </nav>
  </main>

  <script src="vendor/supabase-2.117.3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/kid.js"></script>
</body>
</html>

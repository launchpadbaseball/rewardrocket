<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Reward Rocket 🚀</title>
  <meta name="theme-color" content="#1b1464">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Rocket">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/kid.css">
</head>
<body class="kid-page">

  <section id="k-msg" class="screen" hidden>
    <div class="card center">
      <div class="big-logo">🛸</div>
      <h1 id="k-msg-title">Houston, we have a problem</h1>
      <p class="sub" id="k-msg-body"></p>
    </div>
  </section>

  <main id="k-app" class="wrap kid-wrap" hidden>
    <header class="k-head">
      <div>
        <div class="k-hi" id="k-hi">Hi!</div>
        <div class="k-sub">Mission Control</div>
      </div>
      <div class="k-avatar" id="k-avatar" aria-hidden="true">🪐</div>
    </header>

    <!-- Points -->
    <section class="k-points">
      <div class="k-star"><b id="k-bal">0</b><span>points</span></div>
      <div class="k-today" id="k-today"></div>
    </section>

    <!-- Next prize mission -->
    <section class="card k-mission">
      <h2 id="k-mission-title">🚀 Next mission</h2>
      <div class="k-track">
        <span class="k-earth">🌍</span>
        <div class="k-path"><i id="k-fill"></i><span class="k-rocket" id="k-rocket">🚀</span></div>
        <span class="k-goal" id="k-goal">🎁</span>
      </div>
      <p class="k-left" id="k-left"></p>
    </section>

    <!-- Journal -->
    <section class="card k-journal" id="k-journal">
      <h2>📝 My Day</h2>
      <div id="k-j"></div>
    </section>

    <!-- This week -->
    <section class="card">
      <h2>🌟 My week</h2>
      <div class="week" id="k-week"></div>
    </section>

    <!-- Prizes -->
    <div class="section-title">🎁 Prizes I can win</div>
    <div class="prizes" id="k-prizes"></div>

    <!-- Ways to earn -->
    <section class="card">
      <h2>🏠 Home &amp; School points</h2>
      <ul class="list" id="k-ways"></ul>
    </section>

    <!-- Sports: effort and attitude -->
    <section class="card k-sports" id="k-sports-card">
      <h2>🏅 Sports &amp; Team</h2>
      <p class="k-team" id="k-team"></p>
      <ul class="list" id="k-sports"></ul>
    </section>

    <!-- Recent -->
    <section class="card">
      <h2>🏅 My latest wins</h2>
      <ul class="list" id="k-recent"></ul>
    </section>

    <p class="center k-foot">Only Mom and Dad can give points. Keep being awesome! ✨</p>
  </main>

  <!-- Celebration overlay -->
  <div class="k-party" id="k-party" hidden>
    <div class="k-party-card">
      <div class="k-party-emoji" id="k-party-emoji">⭐</div>
      <div class="k-party-title" id="k-party-title"></div>
      <div class="k-party-body" id="k-party-body"></div>
      <button class="btn pink" id="k-party-ok">Awesome! 🚀</button>
    </div>
  </div>

  <script src="vendor/supabase-2.117.3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/kid.js"></script>
</body>
</html>
